name: Stainless downstream CI

on:
  workflow_dispatch:
    inputs:
      ignore_skip:
        description: 'Ignore the "Stainless: skip" commit lines and run all Stainless tests'
        type: boolean
        required: false
        default: false
      prs:
        description: 'Space-separated Inox PR numbers to merge into main and test together (empty tests main)'
        required: false
        default: ''
      false_benchmarks:
        description: 'Also run the false-valid / false-invalid benchmarks (known Stainless issues, skipped by default)'
        type: boolean
        required: false
        default: false
  # Fork: manual only. The full Stainless suite takes about 40 minutes on a
  # hosted runner, and upstream epfl-lara runs it on every PR anyway.

permissions:
  contents: read

# Cancel a pull request's superseded runs when new commits are pushed.
# Runs on main are never cancelled, so every merge still gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # An Inox change that breaks Stainless until Stainless is updated for it can
  # skip all or some of the Stainless tests with a `Stainless: skip` line in a
  # commit message. The line applies until Stainless main bumps Inox past that
  # commit (see .github/scripts/stainless-skip.sh).
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      stainless: ${{ steps.check.outputs.stainless }}
      all: ${{ steps.check.outputs.all }}
      benchmarks: ${{ steps.check.outputs.benchmarks }}
    steps:
    - name: Checkout Inox
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Find the Stainless skip lines that Stainless hasn't picked up
      id: check
      run: .github/scripts/stainless-skip.sh

  tests:
    needs: check-skip
    if: inputs.ignore_skip || needs.check-skip.outputs.all != 'true'
    # Fork: GitHub-hosted runner (4 cores, 16 GB) instead of the EPFL
    # self-hosted one, with a smaller heap to leave room for the solvers.
    # The integration tests take about 110 CPU-minutes, so they are split
    # into five shards of similar cost that run on separate runners. The last
    # shard runs every suite the others don't name, so new suites are
    # still covered.
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: VerificationSuite (z3), unit tests
            run: |
              sbt -batch -Dtestcase-parallelism=5 "it:testOnly stainless.verification.VerificationSuite -- -z solver=smt-z3"
              sbt -batch -Dtestsuite-parallelism=5 test
          - name: VerificationSuite (cvc5, princess), sbt plugin
            run: |
              sbt -batch -Dtestcase-parallelism=5 "it:testOnly stainless.verification.VerificationSuite -- -z solver=smt-cvc5 -z solver=princess"
              sbt -batch scripted
          - name: TerminationSuite, ImperativeSuite
            run: |
              sbt -batch -Dtestsuite-parallelism=2 -Dtestcase-parallelism=5 "it:testOnly stainless.termination.TerminationSuite stainless.verification.ImperativeSuite"
          # A single test that verifies the whole library, for about 7 minutes.
          - name: LibrarySuite
            run: |
              sbt -batch "it:testOnly stainless.LibrarySuite"
          - name: Other integration tests
            run: |
              sbt -batch -Dtestsuite-parallelism=6 -Dtestcase-parallelism=5 "it:testOnly * -stainless.verification.VerificationSuite -stainless.termination.TerminationSuite -stainless.verification.ImperativeSuite -stainless.LibrarySuite"
    env:
      JAVA_OPTS: -Dsbt.io.implicit.relative.glob.conversion=allow -Xss512M -Xms1024M -Xmx10G -XX:MaxMetaspaceSize=2G -XX:+UseCodeCacheFlushing -XX:ReservedCodeCacheSize=768M
      JAVA_OPTS_TMP_DIR: /tmp/tmp_${{ github.run_id }}_${{ github.run_attempt }}
      INOX_DIR: ${{ github.workspace }}/inox
      STAINLESS_DIR: ${{ github.workspace }}/stainless
    steps:
    - name: Checkout Inox
      uses: actions/checkout@v7
      with:
        path: inox
        fetch-depth: 0
    - name: Merge requested Inox PRs
      if: github.event_name == 'workflow_dispatch' && inputs.prs != ''
      working-directory: ${{ env.INOX_DIR }}
      run: |
        git config user.name "CI" && git config user.email "ci@localhost"
        for pr in ${{ inputs.prs }}; do
          git fetch origin "pull/$pr/head:pr-$pr"
          git merge --no-edit "pr-$pr"
        done
        git log --oneline -n 10
    # The self-hosted runners keep the workspace between runs. Checkout's
    # post-step can't remove the auth header it set in the inox submodule's
    # git config once the next step replaces that submodule, and a stale header
    # makes the next submodule fetch fail with "Duplicate header:
    # Authorization". Start from a fresh clone instead.
    - name: Remove previous Stainless checkout
      run: rm -rf "$STAINLESS_DIR"
    - name: Checkout Stainless
      uses: actions/checkout@v7
      with:
        repository: epfl-lara/stainless
        ref: ${{ needs.check-skip.outputs.stainless }}
        path: stainless
        submodules: recursive
    - name: Update Stainless Inox checkout
      run: |
        rm -rf "$STAINLESS_DIR/inox"
        mkdir -p "$STAINLESS_DIR/inox"
        rsync -a --delete --exclude='.git' "$INOX_DIR/" "$STAINLESS_DIR/inox/"
    - name: Skip false-valid / false-invalid benchmarks
      # These directories hold programs Stainless is known to get wrong: the
      # suites expect the wrong verdict, so an Inox fix that makes Stainless
      # answer correctly turns them red. They track Stainless issues, not Inox
      # regressions, so they shouldn't block Inox changes. Removing the
      # programs makes the suites (and DottyExtractionSuite) register no tests
      # for them.
      if: ${{ !inputs.false_benchmarks }}
      working-directory: ${{ env.STAINLESS_DIR }}/frontends/benchmarks
      run: |
        rm -fv verification/false-valid/*.scala termination/false-invalid/*.scala
    - name: Skip the benchmarks named by Stainless skip lines
      if: ${{ !inputs.ignore_skip && needs.check-skip.outputs.benchmarks != '' }}
      working-directory: ${{ env.STAINLESS_DIR }}/frontends/benchmarks
      env:
        BENCHMARKS: ${{ needs.check-skip.outputs.benchmarks }}
      run: |
        shopt -s nullglob
        while read -r glob; do
          if [ -z "$glob" ]; then continue; fi
          matches=($glob)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "::warning::'Stainless: skip $glob' matches no benchmark."
          else
            rm -rfv "${matches[@]}"
          fi
        done <<< "$BENCHMARKS"
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        cache: sbt
    - name: Setup java options
      # The runners share one machine, with each other and with its users. Without
      # -XX:ActiveProcessorCount, each JVM sizes its GC threads, its JIT threads and its default
      # thread pools for all the processors of the machine. The option replaces the number of
      # processors that the JVM detects, even with a larger one, hence the minimum with nproc.
      run: |
          PROCESSORS=$(( $(nproc) < 16 ? $(nproc) : 16 )) && \
          echo "JAVA_OPTS=$JAVA_OPTS -XX:ActiveProcessorCount=$PROCESSORS -Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR" >> "$GITHUB_ENV" && \
          echo "SBT_OPTS=-Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR --sbt-dir $JAVA_OPTS_TMP_DIR" >> "$GITHUB_ENV"
    - name: Creating temp folder
      run: rm -rf "$JAVA_OPTS_TMP_DIR" && mkdir -p "$JAVA_OPTS_TMP_DIR" && chmod 777 "$JAVA_OPTS_TMP_DIR"
    - name: Install and unpack sbt
      working-directory: ${{ env.STAINLESS_DIR }}
      run: |
        wget https://github.com/sbt/sbt/releases/download/v1.10.1/sbt-1.10.1.tgz
        tar xfz sbt-1.10.1.tgz
        echo "PATH=$STAINLESS_DIR/sbt/bin:$PATH" >> "$GITHUB_ENV"
    - name: Install solvers
      # Same solver versions as `stainless-ci.sh --install-solvers`, but that
      # script fetches CVC4 from cvc4.cs.stanford.edu, which no longer serves
      # the builds and makes the download hang. CVC4 comes from the GitHub
      # archive instead.
      run: |
        set -e
        BIN="$GITHUB_WORKSPACE/.local/bin"
        TMP="$RUNNER_TEMP/solvers"
        mkdir -p "$BIN" "$TMP"
        curl -fsSL https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip -o "$TMP/cvc5.zip"
        unzip -q "$TMP/cvc5.zip" -d "$TMP/cvc5"
        mv "$TMP"/cvc5/*/bin/cvc5 "$BIN/cvc5"
        curl -fsSL https://github.com/CVC4/CVC4-archived/releases/download/1.8/cvc4-1.8-x86_64-linux-opt -o "$BIN/cvc4"
        curl -fsSL https://github.com/Z3Prover/z3/releases/download/z3-5.0.0/z3-5.0.0-x64-glibc-2.39.zip -o "$TMP/z3.zip"
        unzip -q "$TMP/z3.zip" -d "$TMP/z3"
        mv "$TMP"/z3/*/bin/z3 "$BIN/z3"
        chmod +x "$BIN/cvc5" "$BIN/cvc4" "$BIN/z3"
    - name: Add solvers to PATH
      run: echo "$GITHUB_WORKSPACE/.local/bin" >> "$GITHUB_PATH"
    - name: Test solvers availability
      run: cvc5 --version && z3 --version && cvc4 --version
    - name: Build and Package
      working-directory: ${{ env.STAINLESS_DIR }}
      run: ./stainless-ci.sh --build-only && echo "PATH=$STAINLESS_DIR/frontends/dotty/target/universal/stage/bin:$PATH" >> "$GITHUB_ENV"
    - name: Run tests
      working-directory: ${{ env.STAINLESS_DIR }}
      run: ${{ matrix.shard.run }}
    - name: Clean up
      run: rm -rf "$JAVA_OPTS_TMP_DIR"
