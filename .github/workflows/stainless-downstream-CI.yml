name: Stainless downstream CI

on:
  workflow_dispatch:
    inputs:
      prs:
        description: 'Space-separated Inox PR numbers to merge into main and test together (empty tests main)'
        required: false
        default: ''
      false_benchmarks:
        description: 'Also run the false-valid / false-invalid benchmarks (known Stainless issues, skipped by default)'
        type: boolean
        required: false
        default: false
  # Fork: manual only. The full Stainless suite takes about 40 minutes on a
  # hosted runner, and upstream epfl-lara runs it on every PR anyway.

permissions:
  contents: read

jobs:
  tests:
    # Fork: GitHub-hosted runner (4 cores, 16 GB) instead of the EPFL
    # self-hosted one, with a smaller heap to leave room for the solvers.
    # The integration tests take about 110 CPU-minutes, so they are split
    # into five shards of similar cost that run on separate runners. The last
    # shard runs every suite the others don't name, so new suites are
    # still covered.
    name: Timeout probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAVA_OPTS: -Dsbt.io.implicit.relative.glob.conversion=allow -Xss512M -Xms1024M -Xmx10G -XX:MaxMetaspaceSize=2G -XX:+UseCodeCacheFlushing -XX:ReservedCodeCacheSize=768M
      JVM_OPTS: -Dsbt.io.implicit.relative.glob.conversion=allow -Xss512M -Xms1024M -Xmx10G -XX:MaxMetaspaceSize=2G -XX:+UseCodeCacheFlushing -XX:ReservedCodeCacheSize=768M
      JAVA_OPTS_TMP_DIR: /tmp/tmp_${{ github.run_id }}_${{ github.run_attempt }}
      INOX_DIR: ${{ github.workspace }}/inox
      STAINLESS_DIR: ${{ github.workspace }}/stainless
    steps:
    - name: Checkout Inox
      uses: actions/checkout@v4
      with:
        path: inox
        fetch-depth: 0
    - name: Merge requested Inox PRs
      if: github.event_name == 'workflow_dispatch' && inputs.prs != ''
      working-directory: ${{ env.INOX_DIR }}
      run: |
        git config user.name "CI" && git config user.email "ci@localhost"
        for pr in ${{ inputs.prs }}; do
          git fetch origin "pull/$pr/head:pr-$pr"
          git merge --no-edit "pr-$pr"
        done
        git log --oneline -n 10
    - name: Checkout Stainless
      uses: actions/checkout@v4
      with:
        repository: epfl-lara/stainless
        path: stainless
        submodules: recursive
    - name: Update Stainless Inox checkout
      run: |
        rm -rf "$STAINLESS_DIR/inox"
        mkdir -p "$STAINLESS_DIR/inox"
        rsync -a --delete --exclude='.git' "$INOX_DIR/" "$STAINLESS_DIR/inox/"
    - name: Skip false-valid / false-invalid benchmarks
      # These directories hold programs Stainless is known to get wrong: the
      # suites expect the wrong verdict, so an Inox fix that makes Stainless
      # answer correctly turns them red. They track Stainless issues, not Inox
      # regressions, so they shouldn't block Inox changes. Removing the
      # programs makes the suites (and DottyExtractionSuite) register no tests
      # for them.
      if: ${{ !inputs.false_benchmarks }}
      working-directory: ${{ env.STAINLESS_DIR }}/frontends/benchmarks
      run: |
        rm -fv verification/false-valid/*.scala termination/false-invalid/*.scala
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: sbt
    - name: Setup java options
      run: |
          echo "JAVA_OPTS=$JAVA_OPTS -Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR" >> "$GITHUB_ENV" && \
          echo "JVM_OPTS=$JVM_OPTS -Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR" >> "$GITHUB_ENV" && \
          echo "SBT_OPTS=-Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR --sbt-dir $JAVA_OPTS_TMP_DIR" >> "$GITHUB_ENV"
    - name: Creating temp folder
      run: rm -rf "$JAVA_OPTS_TMP_DIR" && mkdir -p "$JAVA_OPTS_TMP_DIR" && chmod 777 "$JAVA_OPTS_TMP_DIR"
    - name: Install and unpack sbt
      working-directory: ${{ env.STAINLESS_DIR }}
      run: |
        wget https://github.com/sbt/sbt/releases/download/v1.10.1/sbt-1.10.1.tgz
        tar xfz sbt-1.10.1.tgz
        echo "PATH=$STAINLESS_DIR/sbt/bin:$PATH" >> "$GITHUB_ENV"
    - name: Install solvers
      # Same solver versions as `stainless-ci.sh --install-solvers`, but that
      # script fetches CVC4 from cvc4.cs.stanford.edu, which no longer serves
      # the builds and makes the download hang. CVC4 comes from the GitHub
      # archive instead.
      run: |
        set -e
        BIN="$GITHUB_WORKSPACE/.local/bin"
        TMP="$RUNNER_TEMP/solvers"
        mkdir -p "$BIN" "$TMP"
        curl -fsSL https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip -o "$TMP/cvc5.zip"
        unzip -q "$TMP/cvc5.zip" -d "$TMP/cvc5"
        mv "$TMP"/cvc5/*/bin/cvc5 "$BIN/cvc5"
        curl -fsSL https://github.com/CVC4/CVC4-archived/releases/download/1.8/cvc4-1.8-x86_64-linux-opt -o "$BIN/cvc4"
        curl -fsSL https://github.com/Z3Prover/z3/releases/download/z3-5.0.0/z3-5.0.0-x64-glibc-2.39.zip -o "$TMP/z3.zip"
        unzip -q "$TMP/z3.zip" -d "$TMP/z3"
        mv "$TMP"/z3/*/bin/z3 "$BIN/z3"
        chmod +x "$BIN/cvc5" "$BIN/cvc4" "$BIN/z3"
    - name: Add solvers to PATH
      run: echo "$GITHUB_WORKSPACE/.local/bin" >> "$GITHUB_PATH"
    - name: Test solvers availability
      run: cvc5 --version && z3 --version && cvc4 --version
    - name: Build and Package
      working-directory: ${{ env.STAINLESS_DIR }}
      run: ./stainless-ci.sh --build-only && echo "PATH=$STAINLESS_DIR/frontends/dotty/target/universal/stage/bin:$PATH" >> "$GITHUB_ENV"
    - name: Run tests
      working-directory: ${{ env.STAINLESS_DIR }}
      run: |
        set -x
        B=$PWD/frontends/benchmarks/verification/invalid/RedBlackTree2.scala
        for cfg in models:true nomodels:false; do
          name=${cfg%%:*}; cm=${cfg##*:}
          mkdir -p /tmp/$name && cd /tmp/$name
          /usr/bin/time -f "WALL $name %e s" stainless-dotty --solvers=smt-z3 --vc-cache=false --strict-arithmetic=false --batched=true --infer-measures=false --check-measures=no --functions=buggyAdd --check-models=$cm --timeout=150 --debug=smt $B > out.txt 2>&1 || true
          grep -E "WALL|buggyAdd|total:" out.txt | cut -c1-200
          ls -laS smt-sessions | head -8
        done
        for name in models nomodels; do
          f=$(ls -S /tmp/$name/smt-sessions/*.smt2 | head -1)
          echo "FILE $name $f $(wc -c < $f) bytes, $(grep -c check-sat $f) check-sat, $(grep -c '^(push' $f) push"
          for seed in 0 1 2 3 4 5; do
            /usr/bin/time -f "REPLAY $name seed=$seed %e s" timeout 200 z3 -T:180 smt.random_seed=$seed sat.random_seed=$seed $f > /tmp/r.txt 2>&1 || echo "REPLAY $name seed=$seed exit=$?"
            grep "REPLAY" /tmp/r.txt; tail -2 /tmp/r.txt | cut -c1-200
            grep -c "^sat" /tmp/r.txt | sed "s/^/  sat-count /"; grep -c "^unsat" /tmp/r.txt | sed "s/^/  unsat-count /"; grep -c "^unknown\|timeout" /tmp/r.txt | sed "s/^/  unknown-count /"
          done
        done
        f=$(ls -S /tmp/models/smt-sessions/*.smt2 | head -1)
        head -c 3000 $f
        echo; echo ----- last check-sat context; grep -n "check-sat" $f | tail -3
    - name: Clean up
      run: rm -rf "$JAVA_OPTS_TMP_DIR"
